version: "3.8"

services:
  minio:
    image: minio/minio
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console UI
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin12345
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"

  mc:
    image: minio/mc
    container_name: minio-mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 admin admin12345; do
        echo 'MinIO chưa sẵn sàng, đợi tiếp...';
        sleep 2;
      done;
      /usr/bin/mc mb local/student-avatar --ignore-existing;
      /usr/bin/mc anonymous set download local/student-avatar;
      exit 0;
      "