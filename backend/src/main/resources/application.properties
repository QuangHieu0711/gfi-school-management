spring.application.name=backend
spring.config.import=optional:application-secret.properties

# ===============================
# DATABASE (PostgreSQL)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gfi_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true
app.upload.dir=uploads

# ===============================
# SERVER
# ===============================
server.port=${SERVER_PORT:8080}

# ===============================
# JWT CONFIGURATION
# ===============================
jwt.secret=${JWT_SECRET:}
jwt.expiration=3600000
jwt.refresh-expiration=86400000

# ===============================
# MAIL
# ===============================
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

# ===============================
# MINIO
# ===============================
minio.url=${MINIO_URL:http://localhost:9000}
minio.accessKey=${MINIO_ACCESSKEY:admin}
minio.secretKey=${MINIO_SECRETKEY:admin12345}
minio.bucketName=${MINIO_BUCKETNAME:gif}
minio.folderName=${MINIO_FOLDERNAME:students}

# ===============================
# AI
# ===============================
ai.generate-comment.url=${AI_GENERATE_COMMENT_URL:http://74.113.235.249:8001/generate-comment}
