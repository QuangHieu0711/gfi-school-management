# ===============================
# APPLICATION
# ===============================
spring:
  application:
    name: backend
  config:
    import: optional:application-secret.properties

  # ===============================
  # DATABASE (PostgreSQL)
  # ===============================
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gfi_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  # ===============================
  # JPA / HIBERNATE
  # ===============================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: never
      encoding: UTF-8

  # ===============================
  # MAIL (Gmail SMTP)
  # ===============================
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ===============================
# FILE UPLOAD (MinIO)
# ===============================
minio:
  url: ${MINIO_URL:http://localhost:9000}
  publicUrl: ${MINIO_PUBLIC_URL:${MINIO_URL:http://localhost:9000}}
  accessKey: ${MINIO_ACCESSKEY:admin}
  secretKey: ${MINIO_SECRETKEY:admin12345}
  bucketName: ${MINIO_BUCKETNAME:gif}
  folderName: ${MINIO_FOLDERNAME:students}

# ===============================
# SERVER
# ===============================
server:
  port: ${SERVER_PORT:8080}

# ===============================
# JWT CONFIGURATION
# ===============================
jwt:
  secret: ${JWT_SECRET:}
  expiration: 3600000
  refresh-expiration: 86400000

# ===============================
# APP MAIL CONFIG
# ===============================
app:
  mail:
    from-name: "He thong GFI"

ai:
  generate-comment:
    url: ${AI_GENERATE_COMMENT_URL:http://74.113.235.249:8001/generate-comment}
