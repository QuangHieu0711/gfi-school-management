# ===============================
# APPLICATION
# ===============================
spring:
  application:
    name: backend
  config:
    import: optional:application-secret.properties

  # ===============================
  # DATABASE (PostgreSQL)
  # ===============================
  datasource:
    url: jdbc:postgresql://localhost:5432/gfi_db
    username: postgres

  # ===============================
  # JPA / HIBERNATE
  # ===============================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: never
      encoding: UTF-8

# ===============================
# FILE UPLOAD (MinIO)
# ===============================
# MinIO cấu hình để upload file (student avatar, staff avatar, signature)
# Phải match với docker-compose.yml MINIO_ROOT_USER và MINIO_ROOT_PASSWORD
minio:
  # URL của MinIO server
  url: http://localhost:9000
  # Access key (username) - PHẢI match docker-compose MINIO_ROOT_USER
  accessKey: admin
  # Secret key (password) - PHẢI match docker-compose MINIO_ROOT_PASSWORD
  secretKey: admin12345
  # Tên bucket để lưu file
  bucketName: GIF
  # Folder trong bucket
  folderName: students

# ===============================
# SERVER
# ===============================
server:
  port: 8080

# ===============================
# JWT CONFIGURATION
# ===============================
jwt:
  expiration: 3600000
  refresh-expiration: 86400000
