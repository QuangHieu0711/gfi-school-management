<app-dialog-container
  [dialogTitle]="title"
  [dialogActionTemplate]="actionTemplate">
  <app-form-control
    #formTpl
    [form]="form"
    (submitEvent)="onSubmit()">
    <div class="flex flex-col gap-2">
      <app-text-control
        [item]="findFormControl($formItem, key.HO)"
        [form]="form"></app-text-control>
      <app-text-control
        [item]="findFormControl($formItem, key.TEN)"
        [form]="form"></app-text-control>
      <app-text-control
        [item]="findFormControl($formItem, key.TEN_TAI_KHOAN)"
        [form]="form"></app-text-control>
      @if (data.type !== TYPE_FORM.DETAIL) {
        <app-text-control
          (mouseenter)="onPasswordMouseEnter()"
          (mouseleave)="onPasswordMouseLeave()"
          [item]="findFormControl($formItem, key.MAT_KHAU)"
          [form]="form"></app-text-control>

      }
      <app-text-control
        [item]="findFormControl($formItem, key.SDT)"
        [form]="form"></app-text-control>
      <app-text-control
        [item]="findFormControl($formItem, key.EMAIL)"
        [form]="form"></app-text-control>
      <app-select-control
        [item]="findFormControl($formItem, key.UNITID)"
        [form]="form"></app-select-control>
      <app-select-control
        [item]="findFormControl($formItem, key.ROLEID)"
        [form]="form"></app-select-control>
      <app-select-control
        [item]="findFormControl($formItem, key.STATUS)"
        [form]="form"></app-select-control>
    </div>
  </app-form-control>

  <ng-template #actionTemplate>
    <button
      color="info"
      matButton="outlined"
      mat-dialog-close>
      Hủy
    </button>
    @if (data.type !== TYPE_FORM.DETAIL) {
      <button
        color="info"
        matButton="filled"
        (click)="formTpl.submit()">
        Lưu
      </button>
    }
    @if (data.type === TYPE_FORM.DETAIL && permission.canEdit(permissionUrl)) {
      <button
        color="info"
        matButton="filled"
        (click)="switchUpdate()">
        Chỉnh sửa
      </button>
    }
  </ng-template>
</app-dialog-container>
