<app-dialog-container
  [dialogTitle]="title"
  [dialogActionTemplate]="actionTemplate">
  <app-form-control
    #formTpl
    [form]="form"
    (submitEvent)="onSubmit()">
    <div class="grid grid-cols-2 gap-4">
      <div class="col-span-2">
        <app-select-control
          [item]="findFormControl($formItem, key.STAFF_ID)"
          [form]="form"></app-select-control>
      </div>

      <app-text-control
        [item]="findFormControl($formItem, key.STAFF_CODE)"
        [form]="form"></app-text-control>
      <app-text-control
        [item]="findFormControl($formItem, key.STAFF_EMAIL)"
        [form]="form"></app-text-control>
      <div class="col-span-2">
        <app-text-control
          [item]="findFormControl($formItem, key.STAFF_UNIT)"
          [form]="form"></app-text-control>
      </div>
      <div class="col-span-2">
        <hr class="my-2 border-gray-200" />
      </div>

      <app-text-control
        [item]="findFormControl($formItem, key.USERNAME)"
        [form]="form"></app-text-control>
      @if (data.type === TYPE_FORM.CREATE) {
        <app-text-control
          (mouseenter)="onPasswordMouseEnter()"
          (mouseleave)="onPasswordMouseLeave()"
          [item]="findFormControl($formItem, key.PASSWORD)"
          [form]="form"></app-text-control>
      }
      <app-select-control
        [item]="findFormControl($formItem, key.ROLE_ID)"
        [form]="form"></app-select-control>
      <app-select-control
        [item]="findFormControl($formItem, key.STATUS)"
        [form]="form"></app-select-control>
    </div>
  </app-form-control>

  <ng-template #actionTemplate>
    <button
      color="primary"
      matButton="outlined"
      mat-dialog-close>
      Hủy
    </button>
    @if (data.type !== TYPE_FORM.DETAIL) {
      <button
        color="primary"
        matButton="filled"
        (click)="formTpl.submit()">
        Lưu
      </button>
    }
    @if (data.type === TYPE_FORM.DETAIL && permission.canEdit(permissionUrl)) {
      <button
        color="primary"
        matButton="filled"
        (click)="switchUpdate()">
        Chỉnh sửa
      </button>
    }
  </ng-template>
</app-dialog-container>
