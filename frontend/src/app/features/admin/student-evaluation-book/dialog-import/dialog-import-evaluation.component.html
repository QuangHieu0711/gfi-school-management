<app-dialog-container [dialogActionTemplate]="Actions">
  <ng-container header-template>
    <div class="flex justify-between items-center gap-2 w-full">
      <h6 mat-dialog-title class="!p-0 !text-lg !font-semibold !text-night-500 max-w-full">
        <span class="block max-w-full truncate">Kết nạp đánh giá học sinh</span>
      </h6>
      <button color="primary" matButton="text" (click)="downloadTemplate()">
        <app-icon icon="svg:download" />
        Tải mẫu kết nạp
      </button>
    </div>
  </ng-container>

  <div class="grid grid-cols-2 gap-4 mb-4">
    <app-select-control [item]="findFormControl($formItem, 'classroomId')" [form]="form"></app-select-control>
    <app-select-control [item]="findFormControl($formItem, 'subjectId')" [form]="form"></app-select-control>
    <app-select-control [item]="findFormControl($formItem, 'semesterId')" [form]="form"></app-select-control>
  </div>

  <app-file-control [item]="findFormControl($formItem, 'file')" [form]="form"></app-file-control>
</app-dialog-container>

<ng-template #Actions>
  <button color="primary" matButton="outlined" mat-dialog-close>
    Thoát
  </button>
  <button type="button" color="primary" matButton="filled" (click)="onSubmit()" cdkFocusInitial>
    Nhập dữ liệu
  </button>
</ng-template>
