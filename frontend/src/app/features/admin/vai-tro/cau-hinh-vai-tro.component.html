<section class="permission-page">
  <div class="permission-header">
    <a
      class="back-link"
      [routerLink]="['/', navigatorEndpoint.ADMIN.BASE_PATH, navigatorEndpoint.ADMIN.VAI_TRO.BASE_PATH]">
      <app-icon icon="arrow_back" [size]="20" />
      <span>{{ getRoleName() }}</span>
    </a>
  </div>

  <section class="permission-table-panel">
    <div class="table-head">
      <h2>Bảng quyền chi tiết</h2>
    </div>

    <div class="permission-toolbar">
      <div class="permission-search">
        <app-form-control
          [form]="searchForm"
          (submitEvent)="submitSearch()"
          (resetEvent)="resetSearch()">
          <div class="search-row">
            <div class="search-input">
              <app-text-control
                [item]="findFormControl(searchItems, 'keyword')"
                [form]="searchForm"></app-text-control>
            </div>

            <div class="search-actions">
              <button
                color="dark"
                matIconButton="text"
                matTooltip="Tìm kiếm"
                type="submit">
                <app-icon icon="svg:search" color="#858585" />
              </button>
              <button
                color="dark"
                matIconButton="text"
                matTooltip="Làm mới"
                type="reset">
                <app-icon icon="svg:cached" color="#858585" />
              </button>
            </div>
          </div>
        </app-form-control>
      </div>

      <div class="toolbar-actions">
        <button
          color="primary"
          matButton="outlined"
          type="button"
          [disabled]="saving"
          (click)="resetChanges()">
          Hủy
        </button>
        <button
          color="primary"
          matButton="filled"
          type="button"
          [disabled]="saving"
          (click)="saveAllChanges()">
          {{ saving ? 'Đang lưu...' : 'Lưu' }}
        </button>
      </div>
    </div>

    <app-table
      tableTitle=""
      [loading]="loading"
      [pageIndex]="pageIndex"
      [pageSize]="pageSize"
      [total]="dataSourceTotal"
      [tableConfig]="tableConfig"
      [dataSource]="dataSource"
      [tableColumns]="columns">
    </app-table>
  </section>
</section>

<ng-template
  #menuNameTpl
  let-row>
  <div
    class="menu-cell"
    [style.--menu-level]="row?.level ?? 0">
    <button
      type="button"
      class="menu-toggle"
      [class.is-placeholder]="!hasChildren(row)"
      (click)="toggleRow(row, $event)">
      @if (hasChildren(row)) {
        <app-icon [icon]="isExpanded(row) ? 'expand_more' : 'chevron_right'" [size]="18" />
      }
    </button>
    <div class="menu-copy">
      <span class="menu-inline">
        <span class="menu-node-icon">
          @if (row?.icon) {
            <app-icon [icon]="row?.icon" [size]="20" />
          }
        </span>
        <span class="menu-title">{{ row?.name }}</span>
      </span>
    </div>
  </div>
</ng-template>

<ng-template
  #menuCodeTpl
  let-row>
  <span class="menu-code">{{ row?.code }}</span>
</ng-template>

<ng-template
  #pathTpl
  let-row>
  <div class="path-cell">
    @if (row?.url) {
      <code>{{ row?.url }}</code>
    } @else {
      <span></span>
    }
  </div>
</ng-template>

<ng-template
  #toggleTpl
  let-row
  let-col="colDef">
  <div class="toggle-cell">
    @if (!isRootMenu(row)) {
      <mat-slide-toggle
        [checked]="col?.field === 'allPermissions' ? isAllSelected(row) : row?.[col?.field] === 1"
        (change)="onTogglePermission(row, col?.field, $event)"></mat-slide-toggle>
    }
  </div>
</ng-template>
