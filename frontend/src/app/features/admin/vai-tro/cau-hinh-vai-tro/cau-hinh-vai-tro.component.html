<section class="permission-page">
  <div class="permission-header">
    <a
      class="back-link"
      [routerLink]="[
        '/',
        navigatorEndpoint.ADMIN.BASE_PATH,
        navigatorEndpoint.ADMIN.VAI_TRO.BASE_PATH,
      ]">
      <app-icon
        icon="arrow_back"
        [size]="20" />
      <span>{{ getRoleName() }}</span>
    </a>
  </div>

  <section class="permission-table-panel">
    <div class="table-head">
      <div class="title-section">
        <h2>Phân quyền vai trò</h2>
        @if (hasDirtyChanges) {
          <span class="dirty-badge">{{ dirtyChangeCount }} thay đổi chưa lưu</span>
        }
      </div>
    </div>

    <mat-tab-group
      class="permission-tabs"
      [selectedIndex]="activeTab === 'function' ? 0 : 1"
      [preserveContent]="true"
      (selectedIndexChange)="setActiveTab($event)">
      <mat-tab>
        <ng-template mat-tab-label>
          <app-icon
            icon="security"
            [size]="18"
            class="tab-icon"></app-icon>
          <span>Phân quyền chức năng</span>
        </ng-template>
        <section class="tab-panel">
          <phan-quyen-chuc-nang
            [roleId]="roleId"
            [roleDetail]="roleDetail"
            [menusSnapshot]="menusSnapshot"
            (dirtyStateChange)="onDirtyStateChange($event)">
          </phan-quyen-chuc-nang>
        </section>
      </mat-tab>

      <mat-tab>
        <ng-template mat-tab-label>
          <app-icon
            icon="storage"
            [size]="18"
            class="tab-icon"></app-icon>
          <span>Phân quyền dữ liệu</span>
        </ng-template>
        <section class="tab-panel">
          <phan-quyen-du-lieu
            [roleId]="roleId"
            [roleDetail]="roleDetail"
            [menusSnapshot]="menusSnapshot"
            (dirtyStateChange)="onDirtyStateChange($event)">
          </phan-quyen-du-lieu>
        </section>
      </mat-tab>
    </mat-tab-group>
  </section>
</section>
