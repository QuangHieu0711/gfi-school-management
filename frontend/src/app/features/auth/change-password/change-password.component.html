<div class="change-password-page">
  <div class="change-password-overlay"></div>

  <div class="change-password-card">
    <img class="change-password-logo" [src]="logoUrl" alt="Logo" />

    <h1 class="change-password-title">Đổi mật khẩu</h1>
    <p class="change-password-subtitle">Vì lý do bảo mật, bạn cần thay đổi mật khẩu trước khi tiếp tục truy cập hệ thống.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="change-password-form">
      <div class="change-password-field">
        <app-text-control [item]="$formItem[0]" [form]="form"></app-text-control>
      </div>

      <div class="change-password-field">
        <app-text-control [item]="$formItem[1]" [form]="form"></app-text-control>
      </div>

      <div class="change-password-field">
        <app-text-control [item]="$formItem[2]" [form]="form"></app-text-control>
      </div>

      <button matButton="filled" color="primary" class="change-password-submit" type="submit">
        Xác nhận
      </button>
    </form>
  </div>
</div>
