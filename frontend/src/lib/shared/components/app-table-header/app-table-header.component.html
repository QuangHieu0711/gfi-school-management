@for (row of headerRows; track $index; let rowIndex = $index) {
  <tr
    role="row"
    matHeaderRow
    class="mat-mdc-header-row mdc-data-table__header-row cdk-header-row">
    @for (cell of row; track $index) {
      <th
        [attr.colspan]="cell.colspan ?? 1"
        [attr.rowspan]="cell.rowspan ?? 1"
        [attr.data-slot]="cell.slotField || null"
        role="columnheader"
        matHeaderCell
        class="mat-mdc-header-cell mdc-data-table__header-cell cdk-header-cell cdk-column-rowIndex mat-column-rowIndex mat-mdc-table-sticky mat-mdc-table-sticky-border-elem-top !z-[100]"
        [style.top.px]="rowIndex * 48">
        <div class="mat-header-cell-inner">
          <div class="mat-sort-header mat-sort-header-disabled">
            <div class="mat-sort-header-container mat-focus-indicator">
              <div class="mat-sort-header-content">
                <span>{{ cell.title }}</span>
              </div>
            </div>
          </div>
        </div>
      </th>
    }
  </tr>
}
