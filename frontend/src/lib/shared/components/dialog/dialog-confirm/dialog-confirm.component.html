<div class="dialog-wrapper confirm-dialog">
  <mat-dialog-content class="!py-6 !flex flex-col items-center">
    <h6 class="!p-0 !text-xl mb-2 text-primary-500">
      {{ data.title }}
    </h6>
    <p class="text-[#333333]">{{ data.message }}</p>
  </mat-dialog-content>
  <mat-dialog-actions
    align="center"
    class="!pt-0">
    <button
      color="info"
      matButton="outlined"
      (click)="onCancel()">
      {{ data.cancelButtonText }}
    </button>
    <button
      color="info"
      matButton="filled"
      (click)="onConfirm()">
      {{ data.confirmButtonText }}
    </button>
  </mat-dialog-actions>
</div>
