<div class="form-group">
  @if (item.showLabel) {
    <label
      class="block mb-0.5"
      [class.error]="isInvalidControl()"
      [for]="item.key">
      {{ item.label }}
      @if (isRequired()) {
        <span class="control-required">*</span>
      }
    </label>
  }
  <div
    class="form-control tag-control"
    [class.disabled]="isDisabled()">
    <mat-form-field
      appearance="outline"
      [formGroup]="form">
      <mat-chip-grid
        #chipGrid
        [formControlName]="item.key">
        @for (tag of tags(); track tag) {
          <mat-chip-row
            (removed)="removeTag(tag)"
            class="tag max-w-30 truncate"
            color="info"
            [matTooltip]="tag">
            <span class="text-primary-500 block max-w-50 truncate">{{ tag }}</span>
            @if (!isDisabled() && !isReadOnly()) {
              <button
                matIconButton="text"
                color="info"
                matChipRemove>
                <app-icon
                  [size]="18"
                  icon="close_small"
                  iconClass="!text-primary-500"
                  [style.height.px]="18" />
              </button>
            }
          </mat-chip-row>
        }

        <input
          [id]="item.key"
          [name]="item.key"
          type="text"
          [placeholder]="(tags().length ? '' : item.placeholder) ?? ''"
          [readonly]="isReadOnly()"
          [autocomplete]="item.type === 'email' ? 'email' : 'off'"
          [tabIndex]="item.tabIndex ?? 0"
          [matChipInputFor]="chipGrid"
          [matChipInputAddOnBlur]="true"
          [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
          (matChipInputTokenEnd)="addTag($event)"
          (focus)="onFocus($event)"
          (blur)="onBlur($event)"
          (focusout)="onFocusOut($event)" />
      </mat-chip-grid>

      <!-- Hint -->
      @if (item.hint && !isInvalidControl()) {
        <mat-hint>{{ item.hint }}</mat-hint>
      }

      <!-- Error message -->
      @if (isInvalidControl()) {
        <mat-error>{{ getErrorMessage() }}</mat-error>
      }
    </mat-form-field>
  </div>
</div>
