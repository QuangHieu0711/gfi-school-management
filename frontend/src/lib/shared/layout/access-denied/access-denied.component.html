<div
  class="wrapper fixed top-0 right-0 bottom-0 left-0 flex justify-center items-center gap-8">
  <div class="p-16">
    <h1
      class="text-night-500 font-black font-heading uppercase !text-[16rem] !m-0">
      403
    </h1>
    <h5 class="text-night-600 font-black font-heading uppercase">
      {{ 'error.unauthorized.title' | translate }}
    </h5>
    <p class="text-night-900 mb-4 font-light italic text-xl">
      {{ 'error.unauthorized.message' | translate }}
    </p>
    <button
      color="night"
      matButton="filled"
      [routerLink]="['/']">
      <app-icon icon="chevron_left" />
      {{ 'error.backToHomePage' | translate }}
    </button>
  </div>
</div>
