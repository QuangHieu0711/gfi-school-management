<div class="wrapper">
  <app-header-component class="relative z-[2]" />

  <mat-sidenav-container
    class="sidenav-container !bg-white"
    autosize>
    <mat-sidenav-content>
      <div class="clear-margin-collapsing h-full">
        <div class="flex h-full">
          <div
            class="tree-wrapper relative h-full"
            [class.tree-wrapper-collapsed]="isSidebarCollapsed">
            <div
              class="tree-inner-navigator h-full w-full px-1 py-6 overflow-auto"
              [class.tree-inner-navigator-collapsed]="isSidebarCollapsed">
              @if (!isSidebarCollapsed) {
                <div class="sidebar-search">
                  <div class="sidebar-search-box">
                    <app-icon icon="search" [size]="18" />
                    <input
                      type="text"
                      class="sidebar-search-input"
                      placeholder="Tìm kiếm menu"
                      [value]="sidebarSearchTerm"
                      (input)="onSidebarSearch($event)" />
                  </div>
                </div>
              }
              <app-tree
                [dataSource]="treeDataSource"
                [labelTemplate]="labelRef" />
            </div>
            <div class="sidebar-footer">
              <button
                type="button"
                matIconButton
                class="sidebar-toggle"
                [matTooltip]="isSidebarCollapsed ? 'Mở rộng menu' : 'Thu gọn menu'"
                matTooltipPosition="right"
                (click)="toggleSidebarCollapsed()">
                <app-icon [icon]="isSidebarCollapsed ? 'menu_open' : 'menu'" />
              </button>
            </div>
          </div>
          <div
            class="content-wrapper relative flex-1 p-4 pb-12 overflow-y-auto overflow-x-hidden">
            <router-outlet />
          </div>
        </div>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>

<ng-template
  #labelRef
  let-data>
  @if (data.url) {
    <a
      class="flex items-center gap-2 nav-link cursor-pointer tree-link"
      [class.tree-link-collapsed]="isSidebarCollapsed"
      [style.padding-left.px]="isSidebarCollapsed ? null : 12 + (Number(data?.level ?? 0) * 20)"
      [class.tree-link-active]="isTreeNodeActive(data)"
      [matTooltip]="isSidebarCollapsed ? data.name : ''"
      matTooltipPosition="right"
      tabindex="0"
      (click)="$event.stopPropagation(); $event.preventDefault(); goToUrl(data)"
      (keyup)="
        $event.stopPropagation(); $event.preventDefault(); goToUrl(data)
      ">
      <app-icon
        iconClass="grow shrink-0"
        [icon]="data.icon" />
      <span
        class="node-text text-[#001F2D] font-semibold"
        [class.node-text-collapsed]="isSidebarCollapsed"
        [class.active-nav]="isTreeNodeActive(data)"
        >
        {{ data.name }}
      </span>
    </a>
  } @else {
    <span
      class="cursor-pointer flex items-center gap-2 nav-link tree-link"
      [class.tree-link-collapsed]="isSidebarCollapsed"
      [style.padding-left.px]="isSidebarCollapsed ? null : 12 + (Number(data?.level ?? 0) * 20)"
      [matTooltip]="isSidebarCollapsed ? data.name : ''"
      matTooltipPosition="right"
      [class.tree-link-active]="isTreeNodeActive(data)">
      <app-icon
        iconClass="grow shrink-0"
        [icon]="data.icon" />
      <span
        class="node-text text-[#001F2D] font-semibold"
        [class.node-text-collapsed]="isSidebarCollapsed"
        [class.active-nav]="isTreeNodeActive(data)"
        >
        {{ data.name }}
      </span>
    </span>
  }
</ng-template>
