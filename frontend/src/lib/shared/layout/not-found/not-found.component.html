<section class="not-found-page">
  <div class="nf-bg-layer" aria-hidden="true">
    <div class="nf-grid"></div>
    <div class="nf-orb nf-orb-a"></div>
    <div class="nf-orb nf-orb-b"></div>
    <div class="nf-orb nf-orb-c"></div>
  </div>

  <div class="nf-shell">

    <!-- Visual: 404 code -->
    <div class="nf-hero" aria-hidden="true">
      <div class="nf-ring nf-ring-1"></div>
      <div class="nf-ring nf-ring-2"></div>
      <div class="nf-ring nf-ring-3"></div>

      <div class="nf-code">
        <span class="nf-digit" data-char="4">4</span>

        <span class="nf-zero">
          <span class="nf-zero-track"></span>
          <span class="nf-zero-face"></span>
          <span class="nf-zero-gem"></span>
        </span>

        <span class="nf-digit" data-char="4">4</span>
      </div>

      <div class="nf-badge">
        <span class="nf-badge-dot"></span>
        <span>ERROR 404</span>
      </div>
    </div>

    <!-- Copy block -->
    <div class="nf-copy">
      <h1 class="nf-title">{{ 'error.notFound.title' | translate }}</h1>
      <p class="nf-desc">{{ 'error.notFound.message' | translate }}</p>

      <div class="nf-actions">
        <button color="primary" matButton="filled" [routerLink]="['/']">
          <app-icon icon="home" />
          <span>Về trang chủ</span>
        </button>
        <button class="nf-ghost-btn" matButton="outlined" type="button" (click)="goBack()">
          <app-icon icon="arrow_back" />
          <span>Quay lại</span>
        </button>
      </div>
    </div>

  </div>
</section>
